# Secret scanning for session transcripts (see "Transcript safety" in CLAUDE.md).
# Extends gitleaks' default rules.

[extend]
useDefault = true

[[rules]]
id = "url-with-credentials"
description = "URL with an embedded password (e.g. database connection strings)"
# user is optional (redis://:pass@host); the password can contain '@' but not '/' or spaces
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@]*:[^\s/]+@[^\s/:@]+'''
keywords = ["://"]

# Local docker-compose credentials, already public in apps/api/.env.example
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''://rivbins:rivbins@localhost''']
