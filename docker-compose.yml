services:
  postgres:
    image: postgres:17-alpine
    container_name: rivbins-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivbins
      POSTGRES_PASSWORD: rivbins
      POSTGRES_DB: rivbins
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivbins -d rivbins"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
